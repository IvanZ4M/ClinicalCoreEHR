<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clinical Core EHR - Sistema de Gestión de Expedientes Clínicos" />
    <title>Clinical Core EHR - Centro Médico</title>
    <!-- Las fuentes se autoalojan vía @fontsource (ver src/index.css).
         No se cargan de la red: la app debe funcionar sin internet. -->
    <script>
      /* Apply saved theme before first paint to avoid flash */
      (function() {
        var t = localStorage.getItem('cc.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var h = localStorage.getItem('cc.accentH');
        if (h) document.documentElement.style.setProperty('--accent-h', h);
        var r = localStorage.getItem('cc.radius');
        if (r) document.documentElement.style.setProperty('--radius', r + 'px');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
